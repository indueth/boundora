[package]
name = "boundora_vault"
version = "0.1.0"
edition = "2021"
description = "Boundora hero account: the tiny contract inside hero-N.<boundora>, holding that hero's NEAR"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
